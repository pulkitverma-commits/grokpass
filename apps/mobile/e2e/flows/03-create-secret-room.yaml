# 03 New chat → Secret → name, nick, code, 1-hour timer → create → invite sheet → copy → done → back
# to Chats. Device A, after 01. The link is read from `invite.link` and published to the local relay
# for device B (04); nothing is printed and no screenshot is taken. The room is a throwaway (1-hour
# timer, name `qa-…`) and is burned by flow 08.
#
# Needs the E2E build (eas.json profile `e2e`, the only producer of `extra.e2e`): every other build masks
# `invite.link` to `…#••••••` (security review W1-9) and `copyTextFrom` then yields no link, which
# fails this flow on purpose. A ends on Chats home, not in the room: the room screen auto-admits
# joiners, and 04-let-in needs the explicit "Let in" row on Chats home.
appId: io.onepeek.app
name: 03-create-secret-room
tags:
  - ios
  - android
  - single
  - two-device
  - device-a
env:
  MAESTRO_ROOM_NAME: qa-launch
  MAESTRO_OWNER_NICK: qa-owner
  MAESTRO_ACCESS_CODE: blue-river-42
  MAESTRO_RELAY: http://127.0.0.1:4311
---
- assertVisible:
    id: "chats.screen"
- tapOn:
    id: "chats.new"
- assertVisible:
    id: "new.screen"
- tapOn:
    id: "new.kind.secret"
- tapOn:
    id: "new.timer.3600"
- assertVisible:
    id: "new.timer.3600"
    checked: true
- tapOn:
    id: "new.code"
- inputText: ${MAESTRO_ACCESS_CODE}
- tapOn:
    id: "new.name"
- inputText: ${MAESTRO_ROOM_NAME}
- tapOn:
    id: "new.nick"
- inputText: ${MAESTRO_OWNER_NICK}
- hideKeyboard
- tapOn:
    id: "new.create"
- extendedWaitUntil:
    visible:
      id: "invite.sheet"
    timeout: 20000
- assertVisible:
    id: "invite.link"
- assertVisible:
    id: "invite.copy"
- assertVisible:
    id: "invite.share"
- copyTextFrom:
    id: "invite.link"
- evalScript: ${output.link = maestro.copiedText}
# A masked link (non-E2E build) has no token: stop here rather than publish something useless.
- assertTrue: ${output.link.indexOf('#') > 0 && output.link.indexOf('•') < 0}
- runScript:
    file: ../scripts/relay-put.js
    env:
      RELAY_KEY: room_link
      RELAY_VALUE: ${output.link}
- tapOn:
    id: "invite.copy"
- assertVisible:
    id: "invite.toast"
- tapOn:
    id: "invite.done"
- extendedWaitUntil:
    visible:
      id: "room.screen"
    timeout: 10000
- assertVisible:
    id: "room.composer"
- runFlow: _common/back-to-chats.yaml
- assertVisible:
    id: "chats.room"
