# 12 Device A: send a one-time secret as a onepeek.io link from inside the room (sheet 07 → "onepeek.io
# link" → view once → create). The link lands in the chat as a card (`link.<id>`); 12.peer opens it on B.
# The secret text is a fixture string. Nothing here reads the link: the card is tapped, never copied.
# Precondition: 05 ran (A and B are in the room). Dry until mobile-ui lands the `secret.*`/`link.<id>` ids.
appId: io.onepeek.app
name: 12-secret-link-in-app
tags:
  - ios
  - android
  - two-device
  - device-a
  - phase-2
env:
  MAESTRO_SECRET: The launch code is 4471
---
- runFlow: _common/open-room.yaml
- tapOn:
    id: "room.secret"
- assertVisible:
    id: "secret.sheet"
- tapOn:
    id: "secret.mode.link"
- tapOn:
    id: "secret.views.1"
- assertVisible:
    id: "secret.views.1"
    checked: true
- assertVisible:
    id: "secret.guard"
    checked: true
- tapOn:
    id: "secret.text"
- inputText: ${MAESTRO_SECRET}
- hideKeyboard
- tapOn:
    id: "secret.create"
- assertNotVisible:
    id: "secret.sheet"
# The link card is a bubble of ours; the secret text is not in the chat.
- extendedWaitUntil:
    visible:
      id: "link\\..+"
    timeout: 20000
- assertNotVisible: ${MAESTRO_SECRET}
