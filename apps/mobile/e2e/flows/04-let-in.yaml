# 04 (owner half) Device A: the pending join shows on Chats home → Let in → open the room.
# Runs after 04-join-with-code on device B. A is on Chats home (03 left it there): the room screen
# would admit automatically, the home row is the explicit path this flow proves.
appId: io.onepeek.app
name: 04-let-in
tags:
  - ios
  - android
  - two-device
  - device-a
---
- runFlow: _common/back-to-chats.yaml
- extendedWaitUntil:
    visible:
      id: "chats.letIn"
    timeout: 30000
- assertVisible:
    id: "chats.pending"
- tapOn:
    id: "chats.letIn"
- extendedWaitUntil:
    notVisible:
      id: "chats.letIn"
    timeout: 15000
- tapOn:
    id: "chats.room"
    index: 0
- extendedWaitUntil:
    visible:
      id: "room.screen"
    timeout: 10000
- assertVisible:
    id: "room.title"
