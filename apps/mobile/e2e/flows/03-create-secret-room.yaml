# 03 New chat → Secret → timer → create → invite sheet shows the link → copy → done.
# Device A, after 01. The link is read from `invite.link` and published to the local relay for
# device B (04); nothing is printed and no screenshot is taken. The room is a throwaway
# (1-hour timer, name `qa-…`) and is burned by flow 08.
appId: io.onepeek.app
name: 03-create-secret-room
tags:
  - ios
  - android
  - single
  - two-device
  - device-a
env:
  MAESTRO_ROOM_NAME: qa-launch
  MAESTRO_OWNER_NICK: qa-owner
  MAESTRO_ACCESS_CODE: blue-river-42
  MAESTRO_RELAY: http://127.0.0.1:4311
---
- assertVisible:
    id: "chats.screen"
- tapOn:
    id: "chats.new"
- assertVisible:
    id: "new.kind.secret"
- tapOn:
    id: "new.kind.secret"
- tapOn:
    id: "new.name"
- inputText: ${MAESTRO_ROOM_NAME}
- tapOn:
    id: "new.nick"
- inputText: ${MAESTRO_OWNER_NICK}
- tapOn:
    id: "new.code"
- inputText: ${MAESTRO_ACCESS_CODE}
- hideKeyboard
- tapOn:
    id: "new.timer"
# TODO(testid): `new.timer.1h`; until then the option is picked by its label.
- tapOn: "1 hour"
- tapOn:
    id: "new.create"
- extendedWaitUntil:
    visible:
      id: "invite.link"
    timeout: 20000
- assertVisible:
    id: "invite.copy"
- assertVisible:
    id: "invite.share"
- copyTextFrom:
    id: "invite.link"
- evalScript: ${output.link = maestro.copiedText}
- runScript:
    file: ../scripts/relay-put.js
    env:
      RELAY_KEY: room_link
      RELAY_VALUE: ${output.link}
- tapOn:
    id: "invite.copy"
- tapOn:
    id: "invite.done"
- extendedWaitUntil:
    visible:
      id: "(room|chats)\\.screen"
    timeout: 10000
