# Sub-flow: from any screen back to Chats home. In a room, `room.back` is one tap on both platforms.
# Elsewhere (Settings, New chat, Join) Android has a system back; iOS does not, so the flow swipes
# from the left edge (native-stack back gesture). Repeated once in case two screens are stacked.
appId: io.onepeek.app
---
- runFlow:
    when:
      visible:
        id: "room.back"
    commands:
      - tapOn:
          id: "room.back"
- runFlow:
    when:
      notVisible:
        id: "chats.screen"
      platform: Android
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: "chats.screen"
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- runFlow:
    when:
      notVisible:
        id: "chats.screen"
      platform: Android
    commands:
      - back
- runFlow:
    when:
      notVisible:
        id: "chats.screen"
      platform: iOS
    commands:
      - swipe:
          start: 2%, 50%
          end: 90%, 50%
- extendedWaitUntil:
    visible:
      id: "chats.screen"
    timeout: 10000
