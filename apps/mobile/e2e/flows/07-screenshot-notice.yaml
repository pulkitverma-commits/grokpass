# 07 Device A: the screenshot notice from device B appears in the room, as a notice row and not as
# a message bubble. TODO(testid): `room.notice` (proposed); until then dry.
appId: io.onepeek.app
name: 07-screenshot-notice
tags:
  - ios
  - android
  - two-device
  - device-a
---
- runFlow: _common/open-room.yaml
- extendedWaitUntil:
    visible:
      id: "room.notice"
    timeout: 30000
- assertVisible:
    id: "room.screen"
