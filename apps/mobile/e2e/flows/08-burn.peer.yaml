# 08 (peer) Device B: the burned room ends here too (`room.ended`), Back to chats shows no room,
# and it stays gone after a relaunch.
appId: io.onepeek.app
name: 08-burn.peer
tags:
  - ios
  - android
  - two-device
  - device-b
---
- extendedWaitUntil:
    visible:
      id: "room.ended"
    timeout: 30000
- assertNotVisible:
    id: "room.composer"
- tapOn:
    id: "room.back"
- extendedWaitUntil:
    visible:
      id: "chats.screen"
    timeout: 10000
- assertNotVisible:
    id: "chats.room"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "chats.screen"
    timeout: 15000
- assertNotVisible:
    id: "chats.room"
