name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu images include Android SDK and accepted SDK licenses.
      # setup-android v3 requests the retired 'tools' SDK package by default.
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk" && test -d "$sdk/platform-tools"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck --workspace @onepeek/mobile
      - run: npm test --workspace @onepeek/mobile -- --runInBand
      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install
      # The runner already provides JDK 17; the resolver only downloads missing JDKs.
      - name: Use installed JDK for React Native Gradle plugin
        shell: bash
        run: |
          "$JAVA_HOME/bin/javac" -version 2>&1 | grep -E '^javac 17([.]|$)'
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path("node_modules/@react-native/gradle-plugin/settings.gradle.kts")
          source = path.read_text()
          pattern = r'(?m)^[ \t]*plugins\s*\{\s*id\("org\.gradle\.toolchains\.foojay-resolver-convention"\)\s*(?:\.version\("1\.0\.0"\)|version\s+"1\.0\.0")\s*\}[ \t]*$'
          updated, count = re.subn(pattern, '// CI: use the installed JDK 17 instead of auto-provisioning.', source)
          if count != 1:
              raise SystemExit("Unexpected React Native settings; review the CI toolchain workaround.")
          path.write_text(updated)
          PY
      # expo-constants is hoisted to root node_modules, but expo itself may be
      # nested in the mobile workspace. Node subprocesses spawned by Gradle need
      # that workspace in their resolution path (Metro settings do not apply).
      - name: Verify Expo config resolution for native build
        shell: bash
        run: |
          export NODE_PATH="$GITHUB_WORKSPACE/apps/mobile/node_modules:$GITHUB_WORKSPACE/node_modules"
          node -e 'const {createRequire}=require("node:module"); const path=require("node:path"); const req=createRequire(path.resolve("node_modules/expo-constants/scripts/getAppConfig.js")); console.log(req.resolve("expo/config"));'
          echo "NODE_PATH=$NODE_PATH" >> "$GITHUB_ENV"
      - name: Compile debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: onepeek-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A release-mode APK embeds the JavaScript bundle; unlike the debug APK it
      # does not require a Metro development server. This artifact is QA only.
      - name: Build standalone release-mode test APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify standalone test APK
        shell: bash
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert 'assets/index.android.bundle' in z.namelist(), 'Missing embedded JavaScript bundle'
              assert z.getinfo('assets/index.android.bundle').file_size > 0
          PY
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/onepeek-badging.txt"
          grep -F "package: name='io.onepeek.app'" "$RUNNER_TEMP/onepeek-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/onepeek-badging.txt"; then
            echo 'Release APK must not be debuggable'; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: onepeek-android-standalone-qa-not-for-distribution
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # Only trusted main builds may use production credentials. Never expose
      # signing keys or production configuration to a pull request build.
      - name: Build and verify production APK and Play bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ONEPEEK_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ONEPEEK_GOOGLE_SERVICES_JSON_B64 }}
          ONEPEEK_ANDROID_KEYSTORE_B64: ${{ secrets.ONEPEEK_ANDROID_KEYSTORE_B64 }}
          ONEPEEK_ANDROID_STORE_PASSWORD: ${{ secrets.ONEPEEK_ANDROID_STORE_PASSWORD }}
          ONEPEEK_ANDROID_KEY_ALIAS: ${{ secrets.ONEPEEK_ANDROID_KEY_ALIAS }}
          ONEPEEK_ANDROID_KEY_PASSWORD: ${{ secrets.ONEPEEK_ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/android-user-release.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: onepeek-android-production-signed
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
