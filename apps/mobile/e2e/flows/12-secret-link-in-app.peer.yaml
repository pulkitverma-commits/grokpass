# 12 (peer) Device B: tap the secret-link card → the in-app viewer in its peek state → Open → revealed
# (the content is never asserted on, held or screenshotted) → close → tap the card again → "Already
# opened" (`viewer.gone`): the server burned it on the first view. Same after a relaunch.
appId: io.onepeek.app
name: 12-secret-link-in-app.peer
tags:
  - ios
  - android
  - two-device
  - device-b
  - phase-2
env:
  MAESTRO_SECRET: The launch code is 4471
---
- runFlow: _common/open-room.yaml
- extendedWaitUntil:
    visible:
      id: "link\\..+"
    timeout: 30000
- assertNotVisible: ${MAESTRO_SECRET}
- tapOn:
    id: "link\\..+"
    index: 0
- extendedWaitUntil:
    visible:
      id: "viewer.screen"
    timeout: 20000
# Peek: what is waiting, not what it says.
- assertVisible:
    id: "viewer.peek"
- assertNotVisible:
    id: "viewer.revealed"
- assertNotVisible: ${MAESTRO_SECRET}
- tapOn:
    id: "viewer.open"
- extendedWaitUntil:
    visible:
      id: "viewer.revealed"
    timeout: 20000
# Guard is on (secret.guard checked in 12): the text is behind hold-to-view, so it is still not in the tree.
- assertVisible:
    id: "viewer.hold"
- assertNotVisible: ${MAESTRO_SECRET}
- assertNotVisible:
    id: "viewer.share"
- tapOn:
    id: "viewer.done"
- assertNotVisible:
    id: "viewer.screen"
# Second open refused by the server.
- tapOn:
    id: "link\\..+"
    index: 0
- extendedWaitUntil:
    visible:
      id: "viewer.gone"
    timeout: 20000
- assertNotVisible:
    id: "viewer.open"
- tapOn:
    id: "viewer.done"
# Still refused after a relaunch.
- stopApp
- launchApp
- runFlow: _common/open-room.yaml
- tapOn:
    id: "link\\..+"
    index: 0
- extendedWaitUntil:
    visible:
      id: "viewer.gone"
    timeout: 20000
- assertNotVisible: ${MAESTRO_SECRET}
