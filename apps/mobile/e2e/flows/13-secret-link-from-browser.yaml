# 13 One device: a onepeek.io secret link arriving from outside the app (Messages, Mail, a browser) opens
# in the app's viewer through the Universal Link / App Link, and the `#key` fragment stays on the device.
# The link is made in the app first (Chats → One-time secret, lead-owned `secret.screen`) and read from
# `secret.link`, which only the E2E build renders unmasked (same rule as `invite.link`, W1-9 / W3-2); it
# goes through the local relay so `relay-get.js` applies the one link rewrite (https → onepeek:// on
# simulators, MAESTRO_UNIVERSAL_LINKS=1 on physical devices). Then: openLink → viewer (peek) → Open →
# revealed → done → openLink again → gone.
#
# Manual counterpart M18 (test-plan §4): the same link on a phone WITHOUT the app opens the website
# (`/s/<id>` with the fragment); on a phone with the app it opens the app directly (iOS: no chooser once
# the AASA verifies; Android: App Link verified, else the disambiguation sheet). A Maestro run cannot
# uninstall the app mid-flow, so that half stays manual.
appId: io.onepeek.app
name: 13-secret-link-from-browser
tags:
  - ios
  - android
  - single
  - phase-2
env:
  MAESTRO_SECRET: The launch code is 4471
  MAESTRO_RELAY: http://127.0.0.1:4311
  MAESTRO_UNIVERSAL_LINKS: "0"
  MAESTRO_ROOM_LINK: ""
---
- runFlow: _common/guest-home.yaml
- tapOn:
    id: "chats.secret"
- assertVisible:
    id: "secret.screen"
- tapOn:
    id: "secret.text"
- inputText: ${MAESTRO_SECRET}
- hideKeyboard
- tapOn:
    id: "secret.expires.3600"
- tapOn:
    id: "secret.views.1"
- tapOn:
    id: "secret.timer.60"
# Copying stays allowed here so the viewer shows `viewer.copy` (noCopy is covered by the interop test).
- assertVisible:
    id: "secret.guard"
    checked: true
- tapOn:
    id: "secret.create"
- extendedWaitUntil:
    visible:
      id: "secret.link"
    timeout: 20000
- assertVisible:
    id: "secret.qr"
- copyTextFrom:
    id: "secret.link"
- evalScript: ${output.link = maestro.copiedText}
# A masked link (non-E2E build) has no key: stop here rather than open something useless.
- assertTrue: ${output.link.indexOf('/s/') > 0 && output.link.indexOf('#') > 0 && output.link.indexOf('•') < 0}
- runScript:
    file: ../scripts/relay-put.js
    env:
      RELAY_KEY: secret_link
      RELAY_VALUE: ${output.link}
- tapOn:
    id: "secret.done"
- assertVisible:
    id: "chats.screen"
# The link comes back the way another app would hand it to us.
- runScript:
    file: ../scripts/relay-get.js
    env:
      RELAY_KEY: secret_link
- openLink: ${output.link}
- extendedWaitUntil:
    visible:
      id: "viewer.screen"
    timeout: 20000
- assertVisible:
    id: "viewer.peek"
- assertNotVisible: ${MAESTRO_SECRET}
- tapOn:
    id: "viewer.open"
- extendedWaitUntil:
    visible:
      id: "viewer.revealed"
    timeout: 20000
- assertVisible:
    id: "viewer.timer"
- assertVisible:
    id: "viewer.hold"
# Guard on: nothing readable until held; the flow never holds.
- assertNotVisible: ${MAESTRO_SECRET}
- tapOn:
    id: "viewer.done"
- assertNotVisible:
    id: "viewer.screen"
# Burned: the same link now opens the "already opened" state.
- openLink: ${output.link}
- extendedWaitUntil:
    visible:
      id: "viewer.gone"
    timeout: 20000
- assertNotVisible:
    id: "viewer.open"
- tapOn:
    id: "viewer.done"
